<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình phát Video Một Chạm Tối Giản</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --success-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #64748b;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1300px;

            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Khung chứa Video */
        .video-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
            aspect-ratio: 16/9;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Lớp phủ chặn tuyệt đối mọi cú click/chạm trên video để không thể dừng */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
        }

        /* Thanh tiến trình (chỉ hiển thị, không thể tương tác để tua) */
        .progress-container {
            width: 100%;
            height: 5px;
            background-color: #1f2937;
            position: relative;
            z-index: 15;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            transition: width 0.1s linear;
        }

        /* Khung điều khiển tối giản */
        .controls {
            padding: 20px;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        /* Định dạng nút bấm */
        button {
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Nút Phát chính */
        #playBtn {
            background-color: var(--primary-color);
            color: white;
            min-width: 180px;
            justify-content: center;
        }

        #playBtn:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        #playBtn:disabled {
            background-color: #374151;
            color: #6b7280;
            cursor: not-allowed;
        }

        /* Nút Lặp */
        #loopBtn {
            background-color: #1f2937;
            color: #d1d5db;
            border: 1px solid var(--border-color);
        }

        #loopBtn:hover {
            background-color: #374151;
        }

        #loopBtn.active {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            border-color: var(--success-color);
        }

        /* Hiệu ứng xoay của icon khi đang phát */
        .spinner {
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Khung chứa Video -->
        <div class="video-wrapper">
            <!-- Lớp phủ chặn click/chạm để không thể tạm dừng video -->
            <div class="video-overlay"></div>
            
            <video id="myVideo" preload="auto">
                <!-- THAY THẾ ĐƯỜNG DẪN VIDEO CỤC BỘ CỦA BẠN VÀO ĐÂY -->
                <source id="videoSource" src="introduce-myself.mp4" type="video/mp4">
                Trình duyệt của bạn không hỗ trợ thẻ video HTML5.
            </video>
        </div>

        <!-- Thanh tiến trình thời lượng (Chỉ xem, không tua được) -->
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <!-- Bộ điều khiển tối giản -->
        <div class="controls">
            <div class="status-bar">
                <span id="timeDisplay">00:00 / 00:00</span>
                <span id="statusText" style="color: var(--primary-color); font-weight: 600;">Sẵn sàng phát</span>
            </div>

            <div class="button-group">
                <!-- Nút phát chính (Sẽ tự động khóa khi video đang chạy) -->
                <button id="playBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <span>Phát Video</span>
                </button>

                <!-- Nút bật/tắt lặp lại tự động -->
                <button id="loopBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="17 1 21 5 17 9"></polyline>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                        <polyline points="7 23 3 19 7 15"></polyline>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                    </svg>
                    <span>Tự động lặp: TẮT</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const playBtn = document.getElementById('playBtn');
        const loopBtn = document.getElementById('loopBtn');
        const progressBar = document.getElementById('progressBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const statusText = document.getElementById('statusText');

        let isLooping = false;

        // Định dạng thời gian (MM:SS)
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Cập nhật thông tin tổng thời lượng khi video được tải xong
        video.addEventListener('loadedmetadata', () => {
            timeDisplay.textContent = `00:00 / ${formatTime(video.duration)}`;
        });

        // Xử lý sự kiện bấm Phát Video
        playBtn.addEventListener('click', () => {
            if (video.ended) {
                video.currentTime = 0;
            }
            
            video.play()
                .then(() => {
                    setPlayingState();
                })
                .catch(error => {
                    console.error("Lỗi phát video:", error);
                    statusText.textContent = "Chờ thêm file video...";
                    statusText.style.color = "#ef4444";
                });
        });

        // Trạng thái Đang phát (Khóa hoàn toàn nút nhấn)
        function setPlayingState() {
            playBtn.disabled = true;
            playBtn.innerHTML = `
                <svg class="spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.2)" stroke-dasharray="80"></circle>
                    <path d="M12 2a10 10 0 0 1 10 10" stroke="white" stroke-linecap="round"></path>
                </svg>
                <span>Đang chiếu...</span>
            `;
            statusText.textContent = "Đang chiếu";
            statusText.style.color = "var(--success-color)";
        }

        // Trạng thái Kết thúc / Dừng (Mở khóa cho phép phát lại)
        function setStoppedState() {
            playBtn.disabled = false;
            playBtn.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <span>Phát lại từ đầu</span>
            `;
            statusText.textContent = "Đã chiếu xong";
            statusText.style.color = "var(--primary-color)";
        }

        // Tiến trình chạy của video
        video.addEventListener('timeupdate', () => {
            if (video.duration) {
                const percent = (video.currentTime / video.duration) * 100;
                progressBar.style.width = `${percent}%`;
                timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
            }
        });

        // Khi video chạy hết thời lượng
        video.addEventListener('ended', () => {
            if (isLooping) {
                video.currentTime = 0;
                video.play().catch(() => {
                    setStoppedState();
                });
            } else {
                setStoppedState();
                progressBar.style.width = '100%';
            }
        });

        // Bật/Tắt chế độ tự động lặp lại
        loopBtn.addEventListener('click', () => {
            isLooping = !isLooping;
            if (isLooping) {
                loopBtn.classList.add('active');
                loopBtn.querySelector('span').textContent = 'Tự động lặp: BẬT';
            } else {
                loopBtn.classList.remove('active');
                loopBtn.querySelector('span').textContent = 'Tự động lặp: TẮT';
            }
        });

        // Vô hiệu hóa nút Spacebar (Phím cách) trên trình duyệt để tránh tạm dừng video
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
